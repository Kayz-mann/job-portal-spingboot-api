server.port=8080
spring.application.name=jobms

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kayzmann}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kayzmann}

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl.auto=update
spring.jpa.show-sql=true

company.service.url=${COMPANY_SERVICE_URL:http://companyms}
review.service.url=${REVIEW_SERVICE_URL:http://reviewms}

management.endpoints.web.exposure.include=*
management.endpoints.health.show-details=always

info.app.name=JobMicroservice
info.app.description=Job microservice
info.app.version=1.0.0

#Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true


