services:
  postgres:
    container_name: postgres_container
    image: postgres:latest
    environment:
      POSTGRES_USER: kayzmann
      POSTGRES_PASSWORD: kayzmann
      POSTGRES_DB: jobapp
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - jobnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kayzmann -d jobapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - jobnet
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  servicereg:
    build:
      context: .
      dockerfile: ./servicereg/Dockerfile
    container_name: service_reg_container
    ports:
      - "8761:8761"
    networks:
      - jobnet
    restart: unless-stopped

  companyms:
    build:
      context: .
      dockerfile: ./companyms/Dockerfile
    container_name: company_ms_container
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobapp
      SPRING_DATASOURCE_USERNAME: kayzmann
      SPRING_DATASOURCE_PASSWORD: kayzmann
      EUREKA_SERVER_URL: http://servicereg:8761/eureka/
    networks:
      - jobnet
    depends_on:
      postgres:
        condition: service_healthy
      servicereg:
        condition: service_started
    restart: unless-stopped

  reviewms:
    build:
      context: .
      dockerfile: ./reviewms/Dockerfile
    container_name: review_ms_container
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobapp
      SPRING_DATASOURCE_USERNAME: kayzmann
      SPRING_DATASOURCE_PASSWORD: kayzmann
      EUREKA_SERVER_URL: http://servicereg:8761/eureka/
    networks:
      - jobnet
    depends_on:
      postgres:
        condition: service_healthy
      servicereg:
        condition: service_started
    restart: unless-stopped

  jobms:
    build:
      context: .
      dockerfile: ./jobms/Dockerfile
    container_name: job_ms_container
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobapp
      SPRING_DATASOURCE_USERNAME: kayzmann
      SPRING_DATASOURCE_PASSWORD: kayzmann
      EUREKA_SERVER_URL: http://servicereg:8761/eureka/
      COMPANY_SERVICE_URL: http://companyms
      REVIEW_SERVICE_URL: http://reviewms
    networks:
      - jobnet
    depends_on:
      postgres:
        condition: service_healthy
      servicereg:
        condition: service_started
      companyms:
        condition: service_started
      reviewms:
        condition: service_started
    restart: unless-stopped

networks:
  jobnet:
    driver: bridge

volumes:
  postgres:
  pgadmin:
