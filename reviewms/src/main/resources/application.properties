server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kayzmann}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kayzmann}

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl.auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=*
management.endpoints.health.show-details=always

info.app.name=ReviewMicroservice
info.app.description=Review microservice
info.app.version=1.0.0
